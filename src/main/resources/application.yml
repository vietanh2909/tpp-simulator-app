spring:
  application:
    name: tpp-simulator-app
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tpp_simulator}
    username: ${SPRING_DATASOURCE_USERNAME:tpp}
    password: ${SPRING_DATASOURCE_PASSWORD:tpp}
    hikari:
      # Tối đa 10 kết nối; chờ lấy kết nối 5 giây rồi báo lỗi (500 INTERNAL_ERROR); kiểm tra kết nối trước khi cấp.
      maximum-pool-size: 10
      connection-timeout: 5000
      validation-timeout: 3000
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    deserialization:
      accept-float-as-int: false
    mapper:
      allow-coercion-of-scalars: false
  web:
    resources:
      add-mappings: false
  servlet:
    multipart:
      # Không xử lý multipart: callback dùng Content-Type multipart/* phải ra 400 UNSUPPORTED_CONTENT_TYPE, không phải 500.
      enabled: false

server:
  # Chỉ lắng nghe loopback theo mặc định (BR6.1). Đổi có chủ ý bằng biến môi trường SERVER_ADDRESS.
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  error:
    whitelabel:
      enabled: false
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never

logging:
  level:
    root: INFO
  pattern:
    # Thời điểm UTC đặt tường minh (không phụ thuộc múi giờ JVM), mức, tên lớp, nội dung.
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX,UTC} %-5level %logger - %msg%n"
