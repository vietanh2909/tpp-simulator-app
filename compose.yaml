services:
  postgres:
    image: postgres:16
    container_name: tpp-simulator-postgres
    environment:
      POSTGRES_DB: tpp_simulator
      POSTGRES_USER: tpp
      POSTGRES_PASSWORD: tpp
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - tpp_simulator_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tpp -d tpp_simulator"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  tpp_simulator_pgdata:
